<!DOCTYPE html>
<html>
<head>
    <title>Send Skill Request</title>
</head>

<body>

    <h1>📩 Send Skill Request</h1>

    <p>
        Request to:
        <strong>{{ receiver.name }}</strong>
    </p>

    <form method="POST">

        {% csrf_token %}

        <label>Select Your Profile:</label>
        <br><br>

        <select name="sender_id" required>

            <option value="">
                -- Select Your Profile --
            </option>

            {% for profile in profiles %}

                <option value="{{ profile.id }}">
                    {{ profile.name }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Skill:</label>
        <br>

        <input type="text" name="skill" required>

        <br><br>

        <label>Message:</label>
        <br>

        <textarea name="message"></textarea>

        <br><br>

        <button type="submit">
            Send Request
        </button>

    </form>

    <br>

    <a href="{% url 'reciprocal_matches' %}">
        Back to Matches
    </a>

</body>
</html>
