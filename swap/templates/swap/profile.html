<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | SkillLoop</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #062a4d,
                    #0b4f86,
                    #1877b9
                );

            color: white;
        }


        /* NAVBAR */

        nav {
            padding: 20px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background:
                rgba(5, 28, 55, 0.35);

            border-bottom:
                1px solid
                rgba(255,255,255,0.12);
        }


        .logo {
            font-size: 28px;
            font-weight: bold;
        }


        .logo span {
            color: #f4d35e;
        }


        .back-btn {
            text-decoration: none;

            background: #f4d35e;
            color: #082f57;

            padding: 10px 20px;

            border-radius: 25px;

            font-weight: bold;
        }


        /* MAIN */

        .container {
            width: 90%;
            max-width: 850px;

            margin: 50px auto;

            background:
                rgba(255,255,255,0.12);

            backdrop-filter: blur(12px);

            padding: 40px;

            border-radius: 22px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);
        }


        .header {
            text-align: center;
            margin-bottom: 35px;
        }


        .header h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }


        .header p {
            color:
                rgba(255,255,255,0.75);
        }


        /* FORM */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .full-width {
            grid-column: 1 / -1;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;
        }


        input,
        textarea,
        select {

            width: 100%;

            padding: 14px;

            border: none;

            outline: none;

            border-radius: 10px;

            font-size: 15px;

            color: #1f2937;

        }


        textarea {
            min-height: 100px;
            resize: vertical;
        }


        input:focus,
        textarea:focus,
        select:focus {

            box-shadow:
                0 0 0 3px
                rgba(244,211,94,0.45);

        }


        /* BUTTON */

        .save-btn {

            width: 100%;

            margin-top: 30px;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background: #f4d35e;

            color: #082f57;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        .save-btn:hover {

            transform:
                translateY(-3px);

        }


        /* MOBILE */

        @media(max-width: 700px) {

            .form-grid {

                grid-template-columns:
                    1fr;

            }


            .container {

                padding: 30px 22px;

            }


            .header h1 {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">

            Skill<span>Loop</span>

        </div>


        <a
            href="{% url 'dashboard' %}"
            class="back-btn"
        >

            ← Dashboard

        </a>

    </nav>



    <!-- PROFILE FORM -->

    <div class="container">


        <div class="header">

            <h1>

                My Profile 👤

            </h1>


            <p>

                Add your skills and learning goals.

            </p>

        </div>



        <form method="POST">

            {% csrf_token %}


            <div class="form-grid">


                <!-- NAME -->

                <div>

                    <label>

                        Full Name

                    </label>


                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div>

                    <label>

                        Email

                    </label>


                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- SKILLS -->

                <div class="full-width">

                    <label>

                        Skills I Can Teach

                    </label>


                    <input
                        type="text"
                        name="skills_teach"
                        placeholder="Example: Python, Java, UI Design"
                    >

                </div>



                <!-- LEARN -->

                <div class="full-width">

                    <label>

                        Skills I Want to Learn

                    </label>


                    <input
                        type="text"
                        name="skills_learn"
                        placeholder="Example: Django, Figma, Communication"
                    >

                </div>



                <!-- BIO -->

                <div class="full-width">

                    <label>

                        About Me

                    </label>


                    <textarea
                        name="bio"
                        placeholder="Tell others about yourself..."
                    ></textarea>

                </div>


            </div>



            <button
                type="submit"
                class="save-btn"
            >

                Save Profile 💾

            </button>


        </form>


    </div>


</body>

</html>
