<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Skill Loop</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.45), transparent 35%),
                radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.40), transparent 35%),
                linear-gradient(135deg, #081b33, #123b68, #2d1b69);
        }

        .login-container {
            width: 420px;
            max-width: 90%;

            padding: 45px 40px;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.16),
                    rgba(255,255,255,0.06)
                );

            border: 1px solid rgba(255,255,255,0.18);

            backdrop-filter: blur(18px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);

            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .login-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 32px;

            border-radius: 22px;

            background: rgba(255,255,255,0.12);

            border: 1px solid rgba(255,255,255,0.15);
        }

        h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #dbeafe;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #eaf4ff;
        }

        input {
            width: 100%;

            padding: 14px 16px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.18);

            background: rgba(255,255,255,0.10);

            color: white;

            outline: none;

            font-size: 15px;
        }

        input::placeholder {
            color: #cbd5e1;
        }

        input:focus {
            border-color: #60a5fa;

            box-shadow:
                0 0 0 3px
                rgba(96,165,250,0.18);
        }

        .login-btn {
            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #60a5fa,
                    #7c3aed
                );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 10px 25px
                rgba(96,165,250,0.25);
        }

        .login-btn:hover {
            transform: translateY(-3px);
        }

        .error {
            margin-top: 18px;

            padding: 12px;

            border-radius: 10px;

            background: rgba(255, 80, 80, 0.15);

            color: #fecaca;

            font-size: 14px;
        }

        .divider {
            margin: 28px 0;

            border: none;

            border-top:
                1px solid
                rgba(255,255,255,0.15);
        }

        .create {
            color: #dbeafe;
            font-size: 14px;
        }

        .create a {
            display: inline-block;

            margin-top: 12px;

            padding: 10px 20px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid
                rgba(255,255,255,0.18);

            color: #ffe66d;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .create a:hover {
            transform: translateY(-2px);

            background:
                rgba(255,255,255,0.16);
        }

        .back-home {
            display: inline-block;

            margin-top: 25px;

            color: #cbd5e1;

            text-decoration: none;

            font-size: 14px;
        }

        .back-home:hover {
            color: #ffe66d;
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="logo">
        🔄 Skill Loop
    </div>


    <div class="login-icon">
        🔐
    </div>


    <h2>Welcome Back!</h2>


    <p class="subtitle">
        Login and continue your skill
        learning journey with Skill Loop.
    </p>


    <form method="POST">

        {% csrf_token %}

        <input
            type="hidden"
            name="action"
            value="login"
        >


        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn"
        >
            Login →
        </button>


    </form>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <hr class="divider">


    <div class="create">

        New to Skill Loop?

        <br>

        <a href="{% url 'create_profile' %}">
            Create Your Profile
        </a>

    </div>


    <a
        href="{% url 'landing_page' %}"
        class="back-home"
    >
        ← Back to Home
    </a>


</div>


</body>

</html>
