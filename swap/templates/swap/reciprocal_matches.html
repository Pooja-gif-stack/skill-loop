<!DOCTYPE html>
<html>
<head>
    <title>Reciprocal Learning - SkillLoop</title>
</head>

<body>

    <h1>🔄 Reciprocal Learning Matches</h1>

    {% if matches %}

        {% for match in matches %}

            <div>
                <h2>
                    {{ match.learner.name }} → {{ match.teacher.name }}
                </h2>

                <p>
                    <strong>{{ match.learner.name }}</strong>
                    wants to learn
                    <strong>{{ match.skill }}</strong>
                    from
                    <strong>{{ match.teacher.name }}</strong>.
                </p>

                <a href="{% url 'send_request' match.teacher.id %}">
                    <button>Send Request</button>
                </a>
            </div>

            <hr>

        {% endfor %}

    {% else %}

        <h2>No matches found yet.</h2>

    {% endif %}

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
