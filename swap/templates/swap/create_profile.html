<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Profile - Skill Loop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .back:hover {
            color: #ffe66d;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .heading h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .heading p {
            opacity: 0.9;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px 15px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            box-shadow: 0 0 0 3px rgba(255, 230, 109, 0.5);
        }

        .skills-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .file-box {
            background: rgba(255, 255, 255, 0.12);
            padding: 15px;
            border-radius: 12px;
        }

        input[type="file"] {
            padding: 5px;
            color: white;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 30px;
            background: #ffe66d;
            color: #333;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: scale(1.02);
        }

        @media (max-width: 600px) {

            .profile-card {
                padding: 25px;
            }

            .skills-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .heading h1 {
                font-size: 28px;
            }

            .top-bar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top-bar">

            <div class="logo">
                🔄 Skill Loop
            </div>

            <a href="{% url 'home' %}" class="back">
                ← Back to Home
            </a>

        </div>


        <div class="profile-card">

            <div class="heading">

                <div class="icon">
                    👤
                </div>

                <h1>
                    Create Your Profile
                </h1>

                <p>
                    Tell the Skill Loop community about yourself,
                    your skills and what you want to learn.
                </p>

            </div>


            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <div class="form-group">

                    <label>
                        About You
                    </label>

                    <textarea
                        name="bio"
                        placeholder="Write a short introduction about yourself..."
                    ></textarea>

                </div>


                <div class="skills-row">

                    <div class="form-group">

                        <label>
                            🎯 Skills You Can Teach
                        </label>

                        <input
                            type="text"
                            name="skills"
                            placeholder="Example: Python, Drawing"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            📚 Skills You Want to Learn
                        </label>

                        <input
                            type="text"
                            name="learning_skills"
                            placeholder="Example: AI, Guitar"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Profile Picture
                    </label>

                    <div class="file-box">

                        <input
                            type="file"
                            name="profile_image"
                            accept="image/*"
                        >

                    </div>

                </div>


                <button type="submit" class="submit-btn">
                    ✨ Create My Profile
                </button>

            </form>

        </div>

    </div>

</body>

</html>
